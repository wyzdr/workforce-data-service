name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for scanning Secret

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & security scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx bandit pip-audit

      # Gate 2: Secret Scanning
      - name: Run Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate 3: Code analytics for security (SAST)
      - name: Run Static Code Security Analysis (Bandit)
        run: |
          bandit -r app/ -ll

      # Vulnerability scanning (Supply Chain Audit)
      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit

      - name: Run ETL Pipeline verification
        run: |
          python import_data.py

      # Gate 1: Test coverage
      - name: Run automated test suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest --cov=app --cov-fail-under=90 tests/